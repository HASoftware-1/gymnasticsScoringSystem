<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Silent Automated Email</title>
</head>
<body>

    <h1>Welcome to my website</h1>
    <p>The email is sending quietly in the background...</p>

    <script>
        // Trigger the email automatically when the page loads
        window.onload = function() {
            sendSilentEmail();
        };

        async function sendSilentEmail() {
            // Replace with your actual Web3Forms Access Key
            const accessKey = "YOUR_ACCESS_KEY_HERE"; 

            const formData = {
                access_key: accessKey,
                subject: "Automated Website Alert",
                message: "A user has opened your webpage.",
                from_name: "My Website System"
            };

            try {
                // Fetch sends the data in the background (no page redirect)
                const response = await fetch("https://web3forms.com", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (result.success) {
                    console.log("Email sent successfully in the background!");
                } else {
                    console.error("Failed to send:", result.message);
                }
            } catch (error) {
                console.error("Error occurred:", error);
            }
        }
    </script>

</body>
</html>
